name: Scrape IKEA Last Chance

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ECONOPLUS }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run scraper
        run: |
          rm -f "public/IKEA store.json"
          mkdir -p public
          python scrape_ikea_last_chance.py \
            --url "https://www.ikea.com/ca/fr/cat/last-chance/?filters=f-availability%3AAVAILABLE_IN_STORE" \
            --output "public/IKEA store.json"

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "public/IKEA store.json"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update IKEA store data"
          git push

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ikea-last-chance
          path: |
            public/IKEA store.json
            debug_ikea_last_chance.html
            debug_ikea_last_chance.png
