name: Scrape IKEA Last Chance

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        store:
          - label: "IKEA Montréal"
            query: "Montréal"
            slug: "montreal-qc"
          - label: "IKEA Boucherville"
            query: "Boucherville"
            slug: "boucherville-qc"
          - label: "IKEA Ottawa"
            query: "Ottawa"
            slug: "ottawa-on"
          - label: "IKEA Québec"
            query: "Québec"
            slug: "quebec-qc"
          - label: "IKEA North York"
            query: "North York"
            slug: "north-york-on"
          - label: "IKEA Toronto Downtown"
            query: "Toronto Downtown"
            slug: "toronto-downtown-on"
          - label: "IKEA Vaughan"
            query: "Vaughan"
            slug: "vaughan-on"
          - label: "IKEA Etobicoke"
            query: "Etobicoke"
            slug: "etobicoke-on"
          - label: "IKEA Burlington"
            query: "Burlington"
            slug: "burlington-on"
          - label: "IKEA Halifax"
            query: "Halifax"
            slug: "halifax-ns"
          - label: "IKEA Winnipeg"
            query: "Winnipeg"
            slug: "winnipeg-mb"
          - label: "IKEA Edmonton"
            query: "Edmonton"
            slug: "edmonton-ab"
          - label: "IKEA Calgary"
            query: "Calgary"
            slug: "calgary-ab"
          - label: "IKEA Coquitlam"
            query: "Coquitlam"
            slug: "coquitlam-bc"
          - label: "IKEA Richmond"
            query: "Richmond"
            slug: "richmond-bc"
    steps:
      - name: Checkout IKEA repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run scraper
        run: |
          rm -rf "public/ikea"
          mkdir -p "public/ikea"
          python scrape_ikea_last_chance.py \
            --expected-store-label "${{ matrix.store.label }}" \
            --store-slug "${{ matrix.store.slug }}" \
            --store-query "${{ matrix.store.query }}" \
            --out-base "public/ikea"

      - name: Checkout econoplus repo
        uses: actions/checkout@v4
        with:
          repository: Olivier-cousineau/econoplus
          path: econoplus
          token: ${{ secrets.ECONOPLUS }}

      - name: Sync IKEA data to econoplus
        run: |
          mkdir -p econoplus/public/ikea
          rsync -av --delete public/ikea/ econoplus/public/ikea/

      - name: Commit and push results to econoplus
        working-directory: econoplus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "public/ikea"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update IKEA last chance data"
          git push

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ikea-last-chance
          path: |
            public/ikea/*/data.json
            debug_ikea_last_chance.html
            debug_ikea_last_chance.png

      - name: Upload store debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-debug-${{ matrix.store.slug }}
          path: |
            store_debug.png
            store_debug.html
            store_debug.txt
          if-no-files-found: ignore
