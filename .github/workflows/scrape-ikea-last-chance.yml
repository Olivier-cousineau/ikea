name: Scrape IKEA Last Chance

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions schedules run in UTC.
    - cron: "0 2 * * 1,5"

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        store:
          - label: "IKEA Montréal"
            query: "Montréal"
            slug: "montreal-qc"
          - label: "IKEA Boucherville"
            query: "Boucherville"
            slug: "boucherville-qc"
          - label: "IKEA Ottawa"
            query: "Ottawa"
            slug: "ottawa-on"
          - label: "IKEA Québec"
            query: "Québec"
            slug: "quebec-qc"
          - label: "IKEA North York"
            query: "North York"
            slug: "north-york-on"
          - label: "IKEA Toronto Downtown"
            query: "Toronto Downtown"
            slug: "toronto-downtown-on"
          - label: "IKEA Vaughan"
            query: "Vaughan"
            slug: "vaughan-on"
          - label: "IKEA Etobicoke"
            query: "Etobicoke"
            slug: "etobicoke-on"
          - label: "IKEA Burlington"
            query: "Burlington"
            slug: "burlington-on"
          - label: "IKEA Halifax"
            query: "Halifax"
            slug: "halifax-ns"
          - label: "IKEA Winnipeg"
            query: "Winnipeg"
            slug: "winnipeg-mb"
          - label: "IKEA Edmonton"
            query: "Edmonton"
            slug: "edmonton-ab"
          - label: "IKEA Calgary"
            query: "Calgary"
            slug: "calgary-ab"
          - label: "IKEA Coquitlam"
            query: "Coquitlam"
            slug: "coquitlam-bc"
          - label: "IKEA Richmond"
            query: "Richmond"
            slug: "richmond-bc"
    steps:
      - name: Checkout IKEA repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run scraper
        run: |
          python scrape_ikea_last_chance.py \
            --expected-store-label "${{ matrix.store.label }}" \
            --store-slug "${{ matrix.store.slug }}" \
            --store-query "${{ matrix.store.query }}" \
            --out-base "public/ikea"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ikea-${{ matrix.store.slug }}
          path: |
            public/ikea/${{ matrix.store.slug }}/data.json
            debug_ikea_last_chance.html
            debug_ikea_last_chance.png

      - name: Upload store debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-debug-${{ matrix.store.slug }}
          path: |
            store_debug.png
            store_debug.html
            store_debug.txt
            store_header_controls.txt
          if-no-files-found: ignore

  publish_to_econoplus:
    runs-on: ubuntu-latest
    needs: scrape
    steps:
      - name: Checkout econoplus repo
        uses: actions/checkout@v4
        with:
          repository: Olivier-cousineau/econoplus
          path: econoplus
          token: ${{ secrets.ECONOPLUS }}

      - name: Download store artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ikea-*
          merge-multiple: true

      - name: Copy store data into econoplus
        run: |
          find artifacts -name data.json -print0 | while IFS= read -r -d '' data_file; do
            slug="$(basename "$(dirname "$data_file")")"
            target_dir="econoplus/public/ikea/$slug"
            mkdir -p "$target_dir"
            cp "$data_file" "$target_dir/data.json"
          done

      - name: Generate store index
        run: |
          cat <<'EOF' > econoplus/public/ikea/stores.json
          [
            "montreal-qc",
            "boucherville-qc",
            "ottawa-on",
            "quebec-qc",
            "north-york-on",
            "toronto-downtown-on",
            "vaughan-on",
            "etobicoke-on",
            "burlington-on",
            "halifax-ns",
            "winnipeg-mb",
            "edmonton-ab",
            "calgary-ab",
            "coquitlam-bc",
            "richmond-bc"
          ]
          EOF

      - name: Commit and push results to econoplus
        working-directory: econoplus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "public/ikea"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update IKEA last chance data"
          git push

  upsert_to_supabase:
    needs: publish_to_econoplus
    if: always() && needs.publish_to_econoplus.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download store artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ikea-*
          merge-multiple: true

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Upsert to Supabase
        if: env.SUPABASE_URL != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_KEY" ]; then
            node scripts/upsert_to_supabase.mjs ikea "artifacts/*/data.json"
          else
            echo "Supabase credentials not configured, skipping"
          fi
